<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#080e0c">
  <meta name="description" content="Fractal Orchard. Small choices. Larger patterns. An experimental game for iOS.">
  <title>Fractal Orchard</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 48 48'%3E%3Crect width='48' height='48' rx='12' fill='%23080e0c'/%3E%3Cpath d='M31 8a18 18 0 1 0 10 14M42 15L32 24l7 8M32 24l-6-5' fill='none' stroke='%23c9a468' stroke-width='2'/%3E%3C/svg%3E">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Jost:wght@300;400&display=swap" rel="stylesheet">
  <style>
    :root { color-scheme: dark; --night:#080e0c; --bone:#e7eae6; --mist:#a5b0a9; --gold:#c9a468; }
    * { box-sizing:border-box; }
    body { margin:0; background:var(--night); color:var(--bone); font-family:'Jost','Avenir Next',sans-serif; font-weight:300; }
    button,a { -webkit-tap-highlight-color:transparent; }
    a { color:inherit; }
    a:focus-visible,button:focus-visible { outline:2px solid var(--gold); outline-offset:6px; }
    .hero { position:relative; min-height:720px; height:94svh; max-height:1100px; isolation:isolate; display:flex; flex-direction:column; align-items:center; text-align:center; }
    .hero-art { position:absolute; inset:auto auto 0; left:50%; transform:translateX(-50%); width:auto; max-width:100%; height:calc(100% - 130px); object-fit:contain; object-position:50% 100%; z-index:-2; mask-image:linear-gradient(90deg,transparent,#000 15%,#000 85%,transparent),linear-gradient(180deg,transparent,#000 12%,#000 88%,transparent); mask-composite:intersect; }
    .hero::after { content:''; position:absolute; inset:0; z-index:-1; background:linear-gradient(180deg,rgba(8,14,12,.4),transparent 38%,transparent 73%,var(--night) 100%); }
    .masthead { width:100%; padding:30px clamp(24px,4vw,64px); display:flex; align-items:center; justify-content:space-between; gap:20px; }
    .sigil { width:30px; height:30px; fill:none; stroke:var(--gold); stroke-width:1.1; stroke-linecap:round; }
    .eyebrow { margin:0; color:var(--mist); font-size:12px; font-weight:400; letter-spacing:.18em; text-transform:uppercase; line-height:1.6; }
    .identity { padding:22px 20px 0; }
    h1 { font-size:clamp(34px,5.4vw,78px); font-weight:300; text-transform:uppercase; letter-spacing:.16em; line-height:1.18; margin:0; text-indent:.16em; }
    .tagline { font-size:clamp(14px,1.25vw,18px); font-weight:300; letter-spacing:.12em; margin:22px 0 0; color:#c8d1cb; }
    .scroll-link { margin-top:auto; margin-bottom:28px; padding:12px 20px; text-decoration:none; display:flex; flex-direction:column; align-items:center; gap:12px; font-size:12px; letter-spacing:.16em; text-transform:uppercase; }
    .scroll-link::after { content:''; height:28px; width:1px; background:linear-gradient(var(--gold),transparent); }
    .pattern { position:relative; max-width:1080px; margin:auto; padding:76px 24px 52px; text-align:center; }
    h2 { margin:0; font-size:clamp(23px,3vw,34px); font-weight:300; letter-spacing:.06em; }
    .marks { display:grid; grid-template-columns:repeat(6,1fr); align-items:center; max-width:600px; margin:0 auto 64px; gap:24px; }
    .mark { width:36px; height:36px; justify-self:center; fill:none; stroke:#a5b0a9; stroke-width:1.15; stroke-linecap:round; stroke-linejoin:round; }
    .mark .warm { stroke:var(--gold); }
    .pattern-art { display:block; width:100%; height:clamp(230px,31vw,340px); margin:12px auto 0; }
    footer { margin:0 clamp(24px,4vw,64px); padding:26px 0 34px; border-top:1px solid #263129; display:flex; justify-content:space-between; align-items:center; gap:24px; }
    footer p { margin:0; font-size:13px; line-height:1.7; color:var(--mist); letter-spacing:.04em; }
    .status { display:flex; align-items:center; gap:10px; }
    .status::before { content:''; flex:0 0 4px; height:4px; border-radius:50%; background:var(--gold); }

    /* Sky. A fixed starfield sits behind the whole page. The hero image is opaque, so a second
       layer twinkles over the hero's sky only: screen-blended so stars vanish against the lit
       canopy, and masked out below the horizon so no stars show through the grass. */
    .sky { position:fixed; left:0; top:0; width:100%; height:100lvh; z-index:-1; pointer-events:none; }
    .hero-stars { position:absolute; inset:0; width:100%; height:100%; z-index:-1; pointer-events:none; mix-blend-mode:screen;
      -webkit-mask-image:linear-gradient(180deg,#000 0%,#000 46%,transparent 64%);
              mask-image:linear-gradient(180deg,#000 0%,#000 46%,transparent 64%); }

    /* Marks. On hover or tap each one comes apart into flickering glyphs and settles, for a
       moment, into something with a face. Script-driven; without script they stay as they are. */
    .mark { overflow:visible; touch-action:manipulation; }
    .mark .hit { fill:transparent; stroke:none; pointer-events:all; }
    .mark .face, .mark .glyph { opacity:0; }
    .mark .face path, .mark .face circle { stroke-dasharray:1; stroke-dashoffset:1; }

    @media (min-width:1600px) { .hero-art { object-fit:contain; } }
    @media (max-width:600px) {
      .hero { height:90svh; min-height:640px; max-height:900px; }
      .hero-art { left:0; transform:none; width:100%; mask-image:linear-gradient(180deg,transparent,#000 12%,#000 88%,transparent); height:calc(100% - 205px); object-fit:cover; object-position:50% 100%; }
      .hero-stars { -webkit-mask-image:linear-gradient(180deg,#000 0%,#000 50%,transparent 68%); mask-image:linear-gradient(180deg,#000 0%,#000 50%,transparent 68%); }
      .masthead { padding-top:24px; }
      .eyebrow { font-size:11px; letter-spacing:.12em; }
      .identity { padding-top:24px; }
      h1 { max-width:350px; font-size:clamp(30px,9vw,46px); line-height:1.3; letter-spacing:.14em; }
      .tagline { max-width:260px; margin:18px auto 0; line-height:1.7; letter-spacing:.07em; }
      .marks { gap:16px; margin-bottom:48px; }
      .mark { width:28px; height:28px; }
      .pattern { padding-top:48px; padding-bottom:40px; }
      footer { align-items:flex-start; flex-direction:column; gap:10px; }
    }
    @media (prefers-reduced-motion:no-preference) { html { scroll-behavior:smooth; } }
  </style>
</head>
<body>

  <main>

      <h2 id="pattern-title">Something reaches out</h2>
      <canvas class="pattern-art" id="constellation" role="img" aria-label="An abstract constellation of silver and amber points, connected by delicate lines.">An abstract constellation of silver and amber points.</canvas>
    </section>
  </main>
  <footer>
    <p>Fractal Orchard</p>
    <p class="status">Closed testing · by invitation</p>
  </footer>
  <script>
    (() => {
      'use strict';
      const canvas = document.getElementById('constellation');
      const ctx = canvas.getContext('2d');
      if (!ctx) return;
      const preference = window.matchMedia('(prefers-reduced-motion: reduce)');
      let reducedMotion = preference.matches;
      let visible = false;
      let frame = 0;
      let time = 0;
      let last = 0;
      let width = 1;
      let height = 1;
      const pointer = { x:0, y:0, live:false };
      // Stable ornamental geometry, independent of any game content.
      const points = [];
      for (let ring = 1; ring <= 4; ring++) {
        const count = ring * 8;
        for (let n = 0; n < count; n++) {
          const angle = n / count * Math.PI * 2 + ring * .34;
          points.push({ x:Math.cos(angle)*ring/4, y:Math.sin(angle)*ring/4, phase:angle+ring });
        }
      }
      function paint() {
        ctx.clearRect(0,0,width,height);
        const radius = Math.min(width*.44,height*.98);
        const scaleY = .42;
        const probeX = pointer.live ? pointer.x : width/2 + Math.cos(time*.0003)*radius*.55;
        const probeY = pointer.live ? pointer.y : height/2 + Math.sin(time*.0004)*radius*.22;
        const positions = points.map(p => ({x:width/2+p.x*radius,y:height/2+p.y*radius*scaleY,phase:p.phase}));
        for (let i=0;i<positions.length;i++) {
          const a=positions[i];
          const proximity=Math.max(0,1-Math.hypot(a.x-probeX,a.y-probeY)/(radius*.65));
          for (let j=i+1;j<positions.length;j++) {
            const b=positions[j];
            const distance=Math.hypot(a.x-b.x,a.y-b.y);
            if (distance>radius*.32) continue;
            ctx.strokeStyle=`rgba(201,164,104,${.05+proximity*.3})`;
            ctx.lineWidth=.65;
            ctx.beginPath();ctx.moveTo(a.x,a.y);ctx.lineTo(b.x,b.y);ctx.stroke();
          }
          const glimmer=.7+.3*Math.sin(time*.0008+a.phase);
          ctx.fillStyle=`rgba(207,216,207,${.3+glimmer*.25+proximity*.4})`;
          ctx.beginPath();ctx.arc(a.x,a.y,1+proximity*1.1,0,Math.PI*2);ctx.fill();
        }
      }
      function tick(stamp) {
        frame=0;
        if (reducedMotion || !visible || document.hidden) return;
        if (!last) last=stamp;
        if (stamp-last>=1000/30) { time+=Math.min(stamp-last,80);last=stamp;paint(); }
        frame=requestAnimationFrame(tick);
      }
      function sync() {
        cancelAnimationFrame(frame);frame=0;last=0;
        if (!reducedMotion && visible && !document.hidden) frame=requestAnimationFrame(tick);
        paint();
      }
      function resize() {
        const rect=canvas.getBoundingClientRect();
        width=rect.width;height=rect.height;
        const dpr=Math.min(window.devicePixelRatio||1,3);
        canvas.width=Math.round(width*dpr);canvas.height=Math.round(height*dpr);
        ctx.setTransform(dpr,0,0,dpr,0,0);paint();
      }
      canvas.addEventListener('pointermove',event=>{
        if(reducedMotion)return;
        const rect=canvas.getBoundingClientRect();
        pointer.x=event.clientX-rect.left;pointer.y=event.clientY-rect.top;pointer.live=true;
      });
      canvas.addEventListener('pointerleave',()=>{pointer.live=false;});
      canvas.addEventListener('pointerup',event=>{if(event.pointerType==='touch')pointer.live=false;});
      preference.addEventListener('change',event=>{reducedMotion=event.matches;pointer.live=false;sync();});
      document.addEventListener('visibilitychange',sync);
      new ResizeObserver(resize).observe(canvas);
      new IntersectionObserver(entries=>{visible=entries[0].isIntersecting;sync();}).observe(canvas);
      resize();sync();
    })();

    // ── Sky: shimmering stars ─────────────────────────────────────────────
    (() => {
      'use strict';
      const preference = window.matchMedia('(prefers-reduced-motion: reduce)');
      const TINTS = { bone:'231,234,230', gold:'214,180,116', cool:'184,207,214' };

      // Stars live in normalized 0..1 coordinates, so a mobile toolbar resizing the viewport
      // stretches the field slightly instead of scattering it.
      function field(count, seed) {
        let s = seed;
        const rand = () => (s = (s * 16807) % 2147483647) / 2147483647;
        const stars = [];
        for (let i = 0; i < count; i++) {
          const bright = rand() < .06;
          const roll = rand();
          stars.push({
            x: rand(), y: rand(),
            r: bright ? 1.05 + rand() * .7 : .32 + rand() * .72,
            base: bright ? .5 : .12 + rand() * .32,
            amp: bright ? .32 : .08 + rand() * .26,
            speed: .35 + rand() * 1.5,
            phase: rand() * Math.PI * 2,
            flarePhase: rand() * Math.PI * 2,
            glint: bright && rand() < .6,
            tint: roll < .1 ? TINTS.gold : roll < .22 ? TINTS.cool : TINTS.bone
          });
        }
        return stars;
      }

      function sky(canvas, { perPixel, seed, watchVisibility }) {
        const ctx = canvas.getContext('2d');
        if (!ctx) return;
        let stars = [], width = 1, height = 1, area = 0, frame = 0, last = 0, visible = !watchVisibility;
        let reduced = preference.matches;

        function draw(t) {
          ctx.clearRect(0, 0, width, height);
          for (const st of stars) {
            let a = st.base;
            if (!reduced) {
              a += st.amp * Math.sin(t * .001 * st.speed + st.phase);
              // Scintillation: a rare, brief flare, like air moving across a star.
              a += Math.pow(Math.max(0, Math.sin(t * .00021 * st.speed + st.flarePhase)), 60) * .55;
            }
            if (a <= .02) continue;
            a = Math.min(1, a);
            const x = st.x * width, y = st.y * height;
            ctx.fillStyle = `rgba(${st.tint},${a.toFixed(3)})`;
            ctx.beginPath(); ctx.arc(x, y, st.r, 0, Math.PI * 2); ctx.fill();
            if (st.glint && a > .5) {
              const reach = st.r * 7 * (a - .42);
              ctx.strokeStyle = `rgba(${st.tint},${((a - .42) * .7).toFixed(3)})`;
              ctx.lineWidth = .5;
              ctx.beginPath();
              ctx.moveTo(x - reach, y); ctx.lineTo(x + reach, y);
              ctx.moveTo(x, y - reach); ctx.lineTo(x, y + reach);
              ctx.stroke();
            }
          }
        }
        function tick(stamp) {
          frame = 0;
          if (reduced || !visible || document.hidden) return;
          if (stamp - last >= 1000 / 30) { last = stamp; draw(stamp); }
          frame = requestAnimationFrame(tick);
        }
        function sync() {
          cancelAnimationFrame(frame); frame = 0;
          if (!reduced && visible && !document.hidden) frame = requestAnimationFrame(tick);
          else draw(0);
        }
        function resize() {
          const rect = canvas.getBoundingClientRect();
          width = rect.width; height = rect.height;
          const dpr = Math.min(window.devicePixelRatio || 1, 2);
          canvas.width = Math.round(width * dpr); canvas.height = Math.round(height * dpr);
          ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
          const nextArea = width * height;
          if (!stars.length || Math.abs(nextArea - area) / Math.max(area, 1) > .35) {
            area = nextArea;
            stars = field(Math.min(900, Math.round(area / perPixel)), seed);
          }
          draw(performance.now());
        }
        preference.addEventListener('change', event => { reduced = event.matches; sync(); });
        document.addEventListener('visibilitychange', sync);
        new ResizeObserver(resize).observe(canvas);
        if (watchVisibility) new IntersectionObserver(entries => { visible = entries[0].isIntersecting; sync(); }).observe(canvas);
        resize(); sync();
      }

      sky(document.getElementById('sky'), { perPixel: 2600, seed: 91317, watchVisibility: false });
      sky(document.getElementById('hero-stars'), { perPixel: 3400, seed: 20431, watchVisibility: true });
    })();

    // ── Marks: glyphs, then faces ─────────────────────────────────────────
    (() => {
      'use strict';
      const NS = 'http://www.w3.org/2000/svg';
      const preference = window.matchMedia('(prefers-reduced-motion: reduce)');
      const marks = Array.from(document.querySelectorAll('.mark'));
      if (!marks.length) return;
      const clamp = v => Math.max(0, Math.min(1, v));

      // A glyph is two to four strokes across a 3 x 3 lattice, sometimes with a ring or a hook:
      // a script that looks as if it should mean something, and does not.
      const NODE = [12, 24, 36];
      function glyphInto(group) {
        group.replaceChildren();
        const strokes = 2 + Math.floor(Math.random() * 3);
        for (let i = 0; i < strokes; i++) {
          const a = [NODE[Math.floor(Math.random() * 3)], NODE[Math.floor(Math.random() * 3)]];
          let b;
          do { b = [NODE[Math.floor(Math.random() * 3)], NODE[Math.floor(Math.random() * 3)]]; } while (b[0] === a[0] && b[1] === a[1]);
          const line = document.createElementNS(NS, 'path');
          const hook = Math.random() < .25;
          line.setAttribute('d', hook
            ? `M${a[0]} ${a[1]} Q${(a[0] + b[0]) / 2 + (Math.random() * 16 - 8)} ${(a[1] + b[1]) / 2 + (Math.random() * 16 - 8)} ${b[0]} ${b[1]}`
            : `M${a[0]} ${a[1]} L${b[0]} ${b[1]}`);
          if (i === 0 && Math.random() < .5) line.setAttribute('class', 'warm');
          group.appendChild(line);
        }
        if (Math.random() < .4) {
          const ring = document.createElementNS(NS, 'circle');
          ring.setAttribute('cx', NODE[Math.floor(Math.random() * 3)]);
          ring.setAttribute('cy', NODE[Math.floor(Math.random() * 3)]);
          ring.setAttribute('r', 2 + Math.random() * 2.5);
          group.appendChild(ring);
        }
      }

      const states = marks.map((svg, index) => {
        const form = svg.querySelector('.form');
        const face = svg.querySelector('.face');
        if (!form || !face) return null;

        // A private warp filter per mark, so one can twist without disturbing the others.
        const id = `warp-${index}`;
        const defs = document.createElementNS(NS, 'defs');
        defs.innerHTML = `<filter id="${id}" x="-40%" y="-40%" width="180%" height="180%">
          <feTurbulence type="fractalNoise" baseFrequency="0.07" numOctaves="2" seed="${index + 3}" result="noise"/>
          <feDisplacementMap in="SourceGraphic" in2="noise" scale="0" xChannelSelector="R" yChannelSelector="G"/></filter>`;
        svg.prepend(defs);
        const stage = document.createElementNS(NS, 'g');
        const glyph = document.createElementNS(NS, 'g');
        glyph.setAttribute('class', 'glyph');
        svg.insertBefore(stage, form);
        stage.append(form, glyph, face);
        stage.setAttribute('filter', `url(#${id})`);
        const hit = document.createElementNS(NS, 'rect');
        hit.setAttribute('class', 'hit');
        hit.setAttribute('x', '0'); hit.setAttribute('y', '0'); hit.setAttribute('width', '48'); hit.setAttribute('height', '48');
        svg.append(hit);

        return {
          svg, form, face, glyph,
          turbulence: defs.querySelector('feTurbulence'),
          displace: defs.querySelector('feDisplacementMap'),
          faceParts: Array.from(face.querySelectorAll('path,circle')),
          p: 0, target: 0, lastGlyph: 0, nextTwitch: 0, twitchUntil: 0, closeTimer: 0, hovered: false
        };
      }).filter(Boolean);

      let frame = 0, lastStamp = 0;

      function render(st, stamp) {
        const reduced = preference.matches;
        const p = st.p;
        if (reduced) {
          st.form.style.opacity = String(1 - p);
          st.face.style.opacity = String(p * .95);
          st.faceParts.forEach(part => { part.style.strokeDashoffset = '0'; });
          st.glyph.style.opacity = '0';
          st.displace.setAttribute('scale', '0');
          return;
        }
        st.form.style.opacity = String(clamp(1 - p / .3));
        const drawn = clamp((p - .46) / .44);
        st.faceParts.forEach(part => { part.style.strokeDashoffset = String(1 - drawn); });
        st.face.style.opacity = String(clamp((p - .46) / .3) * .95);

        const glyphWindow = p > .16 && p < .64;
        if (glyphWindow && stamp - st.lastGlyph > 58) { glyphInto(st.glyph); st.lastGlyph = stamp; }
        st.glyph.style.opacity = glyphWindow ? String(.55 + Math.random() * .4) : '0';

        // Warp peaks mid-change and never quite lets go of a finished face.
        let warp = 15 * Math.sin(Math.PI * p) + 1.4 * p;
        if (p > .98) {
          if (stamp > st.nextTwitch) {
            st.turbulence.setAttribute('seed', String(Math.floor(Math.random() * 999)));
            if (Math.random() < .3) st.twitchUntil = stamp + 130;
            st.nextTwitch = stamp + 900 + Math.random() * 900;
          }
          if (stamp < st.twitchUntil) warp += 5;
        }
        st.displace.setAttribute('scale', warp.toFixed(2));
      }

      function tick(stamp) {
        frame = 0;
        const dt = lastStamp ? Math.min(stamp - lastStamp, 60) : 16;
        lastStamp = stamp;
        let active = false;
        for (const st of states) {
          if (st.p !== st.target) {
            const duration = preference.matches ? 220 : (st.target > st.p ? 900 : 560);
            const step = dt / duration;
            st.p = st.target > st.p ? Math.min(st.target, st.p + step) : Math.max(st.target, st.p - step);
          }
          render(st, stamp);
          if (st.p !== st.target || (st.p === 1 && !preference.matches)) active = true;
        }
        if (active) frame = requestAnimationFrame(tick);
        else lastStamp = 0;
      }
      function wake() { if (!frame) frame = requestAnimationFrame(tick); }
      function open(st) { st.target = 1; wake(); }
      function close(st) { st.target = 0; wake(); }

      for (const st of states) {
        st.svg.addEventListener('pointerenter', event => {
          if (event.pointerType === 'touch') return;
          st.hovered = true; open(st);
        });
        st.svg.addEventListener('pointerleave', event => {
          if (event.pointerType === 'touch') return;
          st.hovered = false; close(st);
        });
        // No hover on a phone: a tap opens a mark for a few seconds.
        st.svg.addEventListener('pointerdown', event => {
          if (event.pointerType !== 'touch') return;
          clearTimeout(st.closeTimer);
          if (st.target === 1) { close(st); return; }
          open(st);
          st.closeTimer = setTimeout(() => close(st), 2600);
        });
      }

      // Now and then, unprompted, one mark turns. Only while the marks are on screen.
      let inView = false, ambient = 0;
      function scheduleAmbient() {
        clearTimeout(ambient);
        if (!inView || document.hidden || preference.matches) return;
        ambient = setTimeout(() => {
          const idle = states.filter(st => st.target === 0 && !st.hovered);
          if (idle.length) {
            const st = idle[Math.floor(Math.random() * idle.length)];
            open(st);
            st.closeTimer = setTimeout(() => { if (!st.hovered) close(st); }, 1900);
          }
          scheduleAmbient();
        }, 6500 + Math.random() * 6500);
      }
      new IntersectionObserver(entries => { inView = entries[0].isIntersecting; scheduleAmbient(); })
        .observe(document.querySelector('.marks'));
      document.addEventListener('visibilitychange', scheduleAmbient);
      preference.addEventListener('change', () => { for (const st of states) { st.target = 0; } wake(); scheduleAmbient(); });
    })();
  </script>
</body>
</html>
