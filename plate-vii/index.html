<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex">
  <meta name="theme-color" content="#080e0c">
  <title>Pl. VII</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 48 48'%3E%3Crect width='48' height='48' rx='12' fill='%23080e0c'/%3E%3Cpath d='M31 8a18 18 0 1 0 10 14M42 15L32 24l7 8M32 24l-6-5' fill='none' stroke='%23c9a468' stroke-width='2'/%3E%3C/svg%3E">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=IM+Fell+English:ital@0;1&family=Jost:wght@300;400&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../trail/trail.css">
  <script src="../trail/trail.js"></script>
  <style>
    .plate { width:min(90vw,calc((100svh - 150px) * 5 / 7),540px); aspect-ratio:5/7; transform:rotate(.8deg); font-family:'IM Fell English',Georgia,serif; }
    .plate canvas.art { position:absolute; inset:0; width:100%; height:100%; }
    .plate-title { position:absolute; left:0; right:0; top:4.5%; text-align:center; font-size:clamp(13px,2.2vw,17px); letter-spacing:.3em; }
    .plate-sub { position:absolute; left:0; right:0; top:9.5%; display:flex; justify-content:center; gap:4px; color:#3a2e1f; }
    .plate-sub .glyph-mark { width:18px; height:18px; stroke-width:3; }
    .clavis { position:absolute; left:8%; right:8%; bottom:5%; display:flex; justify-content:center; align-items:center; gap:clamp(14px,4vw,30px);
      padding-top:10px; border-top:1px solid rgba(43,36,24,.4); font-size:clamp(11px,1.9vw,14px); font-style:italic; }
    .clavis .pair { display:flex; align-items:center; gap:6px; }
    .clavis .glyph-mark { width:20px; height:20px; stroke-width:3; }
    .labels .label { position:absolute; display:flex; gap:2px; color:#2f261a; transform:translate(-50%,-50%); }
    .labels .glyph-mark { width:14px; height:14px; stroke-width:3.2; }
    .union { position:absolute; width:16%; height:9%; transform:translate(-50%,-50%); border:0; padding:0; background:none; cursor:pointer; border-radius:40%; }
    .union::after { content:''; position:absolute; inset:0; border-radius:inherit; box-shadow:0 0 0 0 rgba(201,164,104,0); transition:box-shadow .5s ease; }
    .union:hover::after, .union:focus-visible::after { box-shadow:0 0 18px 4px rgba(201,164,104,.45); }
    .union.held::after { box-shadow:0 0 26px 8px rgba(201,164,104,.6); }
  </style>
</head>
<body>
  <canvas class="sky" data-sky aria-hidden="true"></canvas>
  <div class="bar">
    <a class="home" href="../" aria-label="Back to the orchard" data-leave><svg class="sigil" data-sigil aria-hidden="true"></svg></a>
    <p class="folio">Pl. VII</p>
  </div>
  <main class="stage">
    <div>
      <figure class="paper plate" style="margin:0" aria-label="An old botanical engraving of a graft: new wood bound onto an old rootstock.">
        <canvas class="grain" aria-hidden="true"></canvas>
        <canvas class="art" aria-hidden="true" data-art></canvas>
        <div class="plate-title">Pl. VII</div>
        <div class="plate-sub" aria-hidden="true" data-sub></div>
        <div class="labels" aria-hidden="true" data-labels></div>
        <button class="union" type="button" aria-label="The place where the two woods are bound" data-union></button>
        <figcaption class="clavis" data-clavis><span>Clavis</span></figcaption>
      </figure>
      <p class="caption">The old stock does not know it has been changed.</p>
    </div>
  </main>
  <script>
    (() => {
      'use strict';
      const R = window.Record;
      const figure = document.querySelector('.plate');
      const art = document.querySelector('[data-art]');
      R.paper(figure.querySelector('.grain'), { seed: 7717, stain: [.2, .82], fold: .47 });

      // Geometry in unit coordinates (0..1 across the plate) so labels and the hit area track any size.
      const UNION = [.5, .55];
      const word = (letters, host) => letters.forEach(l => host.append(R.glyph(l)));
      word(['V', 'O', 'S', 'S'], document.querySelector('[data-sub]'));

      const LABELS = [
        { at: [.18, .24], to: [.4, .3], letters: ['L', 'Y', 'H'] },     // the scion's leaves
        { at: [.84, .43], to: [.58, .45], letters: ['E', 'N', 'O'] },   // new wood
        { at: [.16, .56], to: [.43, .55], letters: ['F', 'J'] },        // the bind
        { at: [.84, .72], to: [.54, .74], letters: ['W', 'U', 'D'] }    // old stock
      ];
      const labels = document.querySelector('[data-labels]');
      for (const item of LABELS) {
        const tag = document.createElement('span');
        tag.className = 'label';
        tag.style.left = item.at[0] * 100 + '%'; tag.style.top = item.at[1] * 100 + '%';
        word(item.letters, tag);
        labels.append(tag);
      }
      const clavis = document.querySelector('[data-clavis]');
      for (const letter of ['E', 'W']) {
        const pair = document.createElement('span');
        pair.className = 'pair';
        pair.append(R.glyph(letter));
        const t = document.createElement('span'); t.textContent = '= ' + letter;
        pair.append(t);
        clavis.append(pair);
      }
      const union = document.querySelector('[data-union]');
      union.style.left = UNION[0] * 100 + '%'; union.style.top = UNION[1] * 100 + '%';

      // The engraving: a stem as two edges with hatching, a bound cleft, leaves with ribs.
      function draw() {
        const rect = art.getBoundingClientRect();
        const dpr = Math.min(window.devicePixelRatio || 1, 2);
        art.width = Math.round(rect.width * dpr); art.height = Math.round(rect.height * dpr);
        const g = art.getContext('2d');
        g.setTransform(dpr, 0, 0, dpr, 0, 0);
        const W = rect.width, H = rect.height, P = (x, y) => [x * W, y * H];
        const ink = 'rgba(38,30,20,.88)';
        g.lineCap = 'round'; g.lineJoin = 'round';
        let s = 911; const rand = () => (s = (s * 16807) % 2147483647) / 2147483647;

        const bez = (p0, p1, p2, p3, t) => {
          const u = 1 - t;
          return [u*u*u*p0[0] + 3*u*u*t*p1[0] + 3*u*t*t*p2[0] + t*t*t*p3[0], u*u*u*p0[1] + 3*u*u*t*p1[1] + 3*u*t*t*p2[1] + t*t*t*p3[1]];
        };
        function stem(p0, p1, p2, p3, w0, w1, shade = true) {
          const left = [], right = [];
          for (let k = 0; k <= 40; k++) {
            const t = k / 40, [x, y] = bez(p0, p1, p2, p3, t);
            const [x2, y2] = bez(p0, p1, p2, p3, Math.min(1, t + .01));
            const [x1, y1] = bez(p0, p1, p2, p3, Math.max(0, t - .01));
            const len = Math.hypot(x2 - x1, y2 - y1) || 1, nx = -(y2 - y1) / len, ny = (x2 - x1) / len;
            const w = (w0 + (w1 - w0) * t) / 2;
            left.push([x + nx * w, y + ny * w]); right.push([x - nx * w, y - ny * w]);
          }
          g.strokeStyle = ink; g.lineWidth = 1.1;
          g.beginPath(); left.forEach(([x, y], i) => i ? g.lineTo(x, y) : g.moveTo(x, y)); g.stroke();
          g.beginPath(); right.forEach(([x, y], i) => i ? g.lineTo(x, y) : g.moveTo(x, y)); g.stroke();
          if (shade) {
            g.lineWidth = .55; g.strokeStyle = 'rgba(38,30,20,.55)';
            for (let k = 1; k < 40; k += 2) {
              const [lx, ly] = left[k], [rx, ry] = right[k];
              const mx = lx + (rx - lx) * .55, my = ly + (ry - ly) * .55;
              g.beginPath(); g.moveTo(mx, my); g.lineTo(rx, ry - 2); g.stroke();
            }
          }
        }
        function leaf(x, y, angle, len, width) {
          g.save(); g.translate(x, y); g.rotate(angle);
          g.strokeStyle = ink; g.lineWidth = .9;
          g.beginPath(); g.moveTo(0, 0);
          g.quadraticCurveTo(len * .45, -width, len, 0); g.quadraticCurveTo(len * .45, width, 0, 0); g.stroke();
          g.lineWidth = .6; g.beginPath(); g.moveTo(0, 0); g.lineTo(len * .96, 0); g.stroke();
          g.lineWidth = .4;
          for (let v = 1; v <= 5; v++) {
            const vx = len * v / 6.4, vw = width * Math.sin(Math.PI * v / 6.4) * .8;
            g.beginPath(); g.moveTo(vx, 0); g.lineTo(vx + len * .08, -vw); g.stroke();
            g.beginPath(); g.moveTo(vx, 0); g.lineTo(vx + len * .08, vw); g.stroke();
          }
          g.restore();
        }

        // old stock, rising from a cut root
        stem(P(.5, .93), P(.47, .82), P(.53, .66), P(.5, .58), W * .1, W * .085);
        g.beginPath(); g.ellipse(...P(.5, .93), W * .052, W * .014, 0, 0, Math.PI * 2); g.lineWidth = 1; g.stroke();
        // the scion, narrower, set into the cleft and branching
        stem(P(.5, .53), P(.49, .44), P(.46, .36), P(.42, .22), W * .055, W * .022);
        stem(P(.48, .42), P(.56, .36), P(.62, .3), P(.7, .24), W * .03, W * .012);
        stem(P(.46, .34), P(.38, .31), P(.33, .28), P(.27, .27), W * .022, W * .01);
        // the bind: wraps around the union
        const [ux, uy] = P(...UNION);
        g.lineWidth = .8; g.strokeStyle = ink;
        for (let k = -3; k <= 3; k++) {
          g.beginPath(); g.ellipse(ux, uy + k * H * .009, W * .058, H * .006, -.08, 0, Math.PI * 2); g.stroke();
        }
        g.beginPath(); g.moveTo(ux + W * .058, uy - H * .02); g.quadraticCurveTo(ux + W * .1, uy - H * .045, ux + W * .085, uy - H * .07); g.stroke();
        // leaves along the new wood
        [[.42, .22, -1.9, .1, .03], [.44, .27, -.4, .09, .026], [.7, .24, -.6, .085, .024], [.63, .29, .9, .08, .022],
         [.27, .27, -2.8, .085, .025], [.35, .3, 2.3, .07, .02], [.47, .38, .2, .075, .022], [.45, .33, -2.4, .07, .02]]
          .forEach(([x, y, a, l, wd]) => leaf(x * W, y * H, a, l * W * 1.6, wd * W * 1.4));
        // buds
        [[.49, .47], [.56, .36], [.33, .28]].forEach(([x, y]) => { g.beginPath(); g.arc(x * W, y * H, 2.2, 0, Math.PI * 2); g.lineWidth = .8; g.stroke(); });
        // leader lines to the labels
        g.lineWidth = .5; g.strokeStyle = 'rgba(38,30,20,.6)';
        for (const item of LABELS) {
          const [ax, ay] = P(...item.at), [bx, by] = P(...item.to);
          g.beginPath(); g.moveTo(ax + (bx > ax ? 26 : -26), ay); g.lineTo(bx, by); g.stroke();
        }
      }
      new ResizeObserver(draw).observe(art);

      union.addEventListener('click', () => {
        union.classList.add('held');
        setTimeout(() => R.award('plate'), 600);
      });
      if (R.has('plate')) union.classList.add('held');

      document.querySelectorAll('[data-leave]').forEach(a => a.addEventListener('click', e => { e.preventDefault(); R.go(a.getAttribute('href')); }));
    })();
  </script>
</body>
</html>
