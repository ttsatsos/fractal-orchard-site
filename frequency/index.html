<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex">
  <meta name="theme-color" content="#080e0c">
  <title>Frequency</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 48 48'%3E%3Crect width='48' height='48' rx='12' fill='%23080e0c'/%3E%3Cpath d='M31 8a18 18 0 1 0 10 14M42 15L32 24l7 8M32 24l-6-5' fill='none' stroke='%23c9a468' stroke-width='2'/%3E%3C/svg%3E">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Jost:wght@300;400&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../trail/trail.css?v=4">
  <script src="../trail/trail.js?v=4"></script>
  <script src="sound.js?v=1"></script>
  <style>
    .band { position:relative; width:100vw; height:min(34svh,280px); touch-action:none; cursor:pointer; user-select:none; -webkit-user-select:none; }
    .band canvas { position:absolute; inset:0; width:100%; height:100%; }
    .readings { display:flex; justify-content:center; gap:clamp(40px,10vw,110px); margin-top:34px; }
    .reading { display:flex; flex-direction:column; align-items:center; gap:10px; color:var(--gold); }
    .reading .glyph-mark { width:34px; height:34px; stroke-width:2.2; }
    .reading code { font-family:'Jost',sans-serif; font-size:16px; letter-spacing:.3em; color:var(--mist); }
    .bar-end { display:flex; align-items:center; gap:18px; }
    .sound { width:34px; height:34px; padding:6px; border:0; background:none; color:var(--mist); cursor:pointer; opacity:.8; }
    .sound:hover { color:var(--gold); opacity:1; }
    .sound svg { width:100%; height:100%; fill:none; stroke:currentColor; stroke-width:1.6; stroke-linecap:round; stroke-linejoin:round; }
    .sound .off, .sound[aria-pressed="true"] .on { display:none; }
    .sound[aria-pressed="true"] .off { display:inline; }
    .freq-stage { min-height:calc(100svh - 96px); display:flex; flex-direction:column; justify-content:center; padding-bottom:60px; }
  </style>
</head>
<body data-piece="frequency">
  <canvas class="sky" data-sky aria-hidden="true"></canvas>
  <div class="bar">
    <a class="home" href="../" aria-label="Back to the orchard" data-leave><svg class="sigil" data-sigil aria-hidden="true"></svg></a>
    <div class="bar-end">
      <button class="sound" type="button" aria-label="Mute sound" aria-pressed="false" data-sound>
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 9.5h3.5L12 5.5v13l-4.5-4H4z"/><path class="on" d="M15.5 9a4.5 4.5 0 0 1 0 6M18 6.5a8 8 0 0 1 0 11"/><path class="off" d="M16 9.5l5 5M21 9.5l-5 5"/></svg>
      </button>
      <p class="folio">Frequency</p>
    </div>
  </div>
  <main class="freq-stage">
    <div class="band" role="button" tabindex="0" aria-label="A trembling line. Hold it still." data-band><canvas aria-hidden="true"></canvas></div>
    <div class="readings" aria-hidden="true" data-readings></div>
    <p class="caption">Hold it still.</p>
  </main>
  <script>
    (() => {
      'use strict';
      const R = window.Record;
      const sound = window.OrchardSound;
      const band = document.querySelector('[data-band]');
      const canvas = band.querySelector('canvas');
      const ctx = canvas.getContext('2d');
      const reduced = () => matchMedia('(prefers-reduced-motion: reduce)').matches;

      // What the line carries: C and K, dash and dot, repeating. The readings name only the marks.
      const MORSE = { C: '−·−·', K: '−·−' };
      const readings = document.querySelector('[data-readings]');
      for (const letter of ['C', 'K']) {
        const r = document.createElement('div'); r.className = 'reading';
        r.append(R.glyph(letter));
        const code = document.createElement('code'); code.textContent = MORSE[letter];
        r.append(code); readings.append(r);
      }
      // pulse train in beats: dash = 3, dot = 1, gap within letter 1, between letters 3, before repeat 7
      const train = [];
      let beat = 0;
      for (const letter of ['C', 'K']) {
        for (const mark of MORSE[letter]) { const len = mark === '−' ? 3 : 1; train.push([beat, len]); beat += len + 1; }
        beat += 2;
      }
      const PERIOD = beat + 5;

      let w = 1, h = 1, energy = .15, holding = false, done = R.has('frequency'), frame = 0, lastY = scrollY;
      // Holding fills the line with gold over HOLD_MS. Letting go drains it back slowly, so a
      // near miss is visible, and holding again picks up from wherever the gold has drained to.
      const HOLD_MS = 3000, DRAIN_MS = 4500;
      let progress = done ? 1 : 0, lastT = 0;

      function signal(x, t) {
        // position along the train, drifting left to right
        const beats = ((x / w) * PERIOD * 1.6 - t * .0022) % PERIOD;
        const b = beats < 0 ? beats + PERIOD : beats;
        for (const [start, len] of train) {
          if (b >= start && b < start + len) {
            const u = (b - start) / len;
            return Math.sin(Math.PI * u) * (len > 1 ? .9 : .55);
          }
        }
        return 0;
      }
      function draw(t) {
        ctx.clearRect(0, 0, w, h);
        const mid = h / 2, calm = done ? .25 : 1;
        const tremble = (reduced() ? .15 : energy) * calm;
        const dt = lastT ? Math.min(100, t - lastT) : 0;
        lastT = t;
        if (!done) progress = holding ? Math.min(1, progress + dt / HOLD_MS) : Math.max(0, progress - dt / DRAIN_MS);
        const steady = done ? 1 : progress;
        sound.update(progress, holding, signal(w / 2, reduced() ? 0 : t), done);
        // Build the line once, then draw it twice: a dim unfilled line, and the gold part on top.
        const line = new Path2D();
        const reach = done ? 1 : steady;
        const edgeX = reach * w;
        let edgeY = mid;
        for (let x = 0; x <= w; x += 2) {
          const noise = reduced() ? 0 : (Math.sin(x * .031 + t * .006) + Math.sin(x * .073 - t * .009) * .6 + Math.sin(x * .17 + t * .013) * .3);
          const y = mid - signal(x, reduced() ? 0 : t) * h * .28 * (1 - steady * .4) + noise * h * .06 * tremble * (1 - steady);
          x ? line.lineTo(x, y) : line.moveTo(x, y);
          if (Math.abs(x - edgeX) < 1.5) edgeY = y;
        }
        ctx.lineWidth = 1.3;
        ctx.strokeStyle = reach > 0 ? 'rgba(200,209,203,.45)' : 'rgba(200,209,203,.7)';
        ctx.stroke(line);
        if (reach > 0) {
          ctx.save();
          ctx.beginPath(); ctx.rect(0, 0, edgeX, h); ctx.clip();
          ctx.lineWidth = 3.2;
          ctx.strokeStyle = 'rgba(226,190,120,1)';
          ctx.shadowColor = 'rgba(214,176,106,.9)';
          ctx.shadowBlur = 16;
          ctx.stroke(line);
          ctx.restore();
          if (!done) {
            // a bright point where the gold is advancing (or draining)
            ctx.save();
            ctx.shadowColor = 'rgba(240,210,150,1)'; ctx.shadowBlur = 22;
            ctx.fillStyle = 'rgba(255,236,196,1)';
            ctx.beginPath(); ctx.arc(edgeX, edgeY, holding ? 5 : 3.5, 0, Math.PI * 2); ctx.fill();
            ctx.restore();
          }
        }
        energy = Math.max(.15, energy * .96);
        if (!done && progress >= 1) { done = true; holding = false; R.award('frequency'); sound.startRave(); }
      }
      function loop(t) { draw(t); frame = requestAnimationFrame(loop); }
      function resize() {
        const rect = band.getBoundingClientRect();
        w = rect.width; h = rect.height;
        const dpr = Math.min(devicePixelRatio || 1, 2);
        canvas.width = Math.round(w * dpr); canvas.height = Math.round(h * dpr);
        ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
      }
      // it trembles when anything moves
      addEventListener('scroll', () => { energy = Math.min(3, energy + Math.abs(scrollY - lastY) * .04); lastY = scrollY; }, { passive: true });
      addEventListener('pointermove', e => { if (!holding) energy = Math.min(3, energy + (Math.abs(e.movementX) + Math.abs(e.movementY)) * .015); });
      const start = () => { sound.wake(); if (done) return; holding = true; };
      const stop = () => { holding = false; };
      band.addEventListener('pointerdown', e => { try { band.setPointerCapture(e.pointerId); } catch { /* pointer already gone */ } start(); });
      band.addEventListener('pointerup', stop);
      band.addEventListener('pointercancel', stop);
      band.addEventListener('keydown', e => { if ((e.key === ' ' || e.key === 'Enter') && !e.repeat) { e.preventDefault(); start(); } });
      band.addEventListener('keyup', e => { if (e.key === ' ' || e.key === 'Enter') stop(); });
      // Sound needs a first touch. Any touch will do; on a solved page it brings the far-off music back.
      const soundButton = document.querySelector('[data-sound]');
      sound.onChange(m => { soundButton.setAttribute('aria-pressed', String(m)); soundButton.setAttribute('aria-label', m ? 'Turn sound on' : 'Mute sound'); });
      soundButton.addEventListener('click', () => { sound.wake(); sound.setMuted(!sound.isMuted()); });
      if (done) sound.startRave();
      const firstTouch = () => { sound.wake(); document.removeEventListener('pointerdown', firstTouch, true); document.removeEventListener('keydown', firstTouch, true); };
      document.addEventListener('pointerdown', firstTouch, true);
      document.addEventListener('keydown', firstTouch, true);
      new ResizeObserver(resize).observe(band);
      document.addEventListener('visibilitychange', () => { cancelAnimationFrame(frame); lastT = 0; if (!document.hidden) frame = requestAnimationFrame(loop); });
      resize();
      frame = requestAnimationFrame(loop);
      document.querySelectorAll('[data-leave]').forEach(a => a.addEventListener('click', e => { e.preventDefault(); R.go(a.getAttribute('href')); }));
    })();
  </script>
</body>
</html>
