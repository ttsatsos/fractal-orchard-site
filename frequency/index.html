<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex">
  <meta name="theme-color" content="#080e0c">
  <title>Frequency</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 48 48'%3E%3Crect width='48' height='48' rx='12' fill='%23080e0c'/%3E%3Cpath d='M31 8a18 18 0 1 0 10 14M42 15L32 24l7 8M32 24l-6-5' fill='none' stroke='%23c9a468' stroke-width='2'/%3E%3C/svg%3E">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Jost:wght@300;400&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../trail/trail.css">
  <script src="../trail/trail.js"></script>
  <style>
    .band { position:relative; width:100vw; height:min(34svh,280px); touch-action:none; cursor:pointer; user-select:none; -webkit-user-select:none; }
    .band canvas { position:absolute; inset:0; width:100%; height:100%; }
    .readings { display:flex; justify-content:center; gap:clamp(40px,10vw,110px); margin-top:34px; }
    .reading { display:flex; flex-direction:column; align-items:center; gap:10px; color:var(--gold); }
    .reading .glyph-mark { width:34px; height:34px; stroke-width:2.2; }
    .reading code { font-family:'Jost',sans-serif; font-size:16px; letter-spacing:.3em; color:var(--mist); }
    .freq-stage { min-height:calc(100svh - 96px); display:flex; flex-direction:column; justify-content:center; padding-bottom:60px; }
  </style>
</head>
<body>
  <canvas class="sky" data-sky aria-hidden="true"></canvas>
  <div class="bar">
    <a class="home" href="../" aria-label="Back to the orchard" data-leave><svg class="sigil" data-sigil aria-hidden="true"></svg></a>
    <p class="folio">Frequency</p>
  </div>
  <main class="freq-stage">
    <div class="band" role="button" tabindex="0" aria-label="A trembling line. Hold it still." data-band><canvas aria-hidden="true"></canvas></div>
    <div class="readings" aria-hidden="true" data-readings></div>
    <p class="caption">Hold it still.</p>
  </main>
  <script>
    (() => {
      'use strict';
      const R = window.Record;
      const band = document.querySelector('[data-band]');
      const canvas = band.querySelector('canvas');
      const ctx = canvas.getContext('2d');
      const reduced = () => matchMedia('(prefers-reduced-motion: reduce)').matches;

      // What the line carries: C and K, dash and dot, repeating. The readings name only the marks.
      const MORSE = { C: '−·−·', K: '−·−' };
      const readings = document.querySelector('[data-readings]');
      for (const letter of ['C', 'K']) {
        const r = document.createElement('div'); r.className = 'reading';
        r.append(R.glyph(letter));
        const code = document.createElement('code'); code.textContent = MORSE[letter];
        r.append(code); readings.append(r);
      }
      // pulse train in beats: dash = 3, dot = 1, gap within letter 1, between letters 3, before repeat 7
      const train = [];
      let beat = 0;
      for (const letter of ['C', 'K']) {
        for (const mark of MORSE[letter]) { const len = mark === '−' ? 3 : 1; train.push([beat, len]); beat += len + 1; }
        beat += 2;
      }
      const PERIOD = beat + 5;

      let w = 1, h = 1, energy = .15, held = 0, holding = false, holdStart = 0, done = R.has('frequency'), frame = 0, lastY = scrollY;

      function signal(x, t) {
        // position along the train, drifting left to right
        const beats = ((x / w) * PERIOD * 1.6 - t * .0022) % PERIOD;
        const b = beats < 0 ? beats + PERIOD : beats;
        for (const [start, len] of train) {
          if (b >= start && b < start + len) {
            const u = (b - start) / len;
            return Math.sin(Math.PI * u) * (len > 1 ? .9 : .55);
          }
        }
        return 0;
      }
      function draw(t) {
        ctx.clearRect(0, 0, w, h);
        const mid = h / 2, calm = done ? .25 : 1;
        const tremble = (reduced() ? .15 : energy) * calm;
        const steady = holding ? Math.min(1, (t - holdStart) / 3000) : (done ? 1 : 0);
        ctx.lineWidth = 1.3;
        ctx.beginPath();
        for (let x = 0; x <= w; x += 2) {
          const noise = reduced() ? 0 : (Math.sin(x * .031 + t * .006) + Math.sin(x * .073 - t * .009) * .6 + Math.sin(x * .17 + t * .013) * .3);
          const y = mid - signal(x, reduced() ? 0 : t) * h * .28 * (1 - steady * .4) + noise * h * .06 * tremble * (1 - steady);
          x ? ctx.lineTo(x, y) : ctx.moveTo(x, y);
        }
        const grad = ctx.createLinearGradient(0, 0, w, 0);
        const reach = done ? 1 : steady;
        grad.addColorStop(0, 'rgba(201,164,104,.95)');
        grad.addColorStop(Math.max(.001, reach), 'rgba(201,164,104,.95)');
        grad.addColorStop(Math.min(1, reach + .001), 'rgba(200,209,203,.7)');
        grad.addColorStop(1, 'rgba(200,209,203,.7)');
        ctx.strokeStyle = grad; ctx.stroke();
        energy = Math.max(.15, energy * .96);
        if (holding && !done && t - holdStart >= 3000) { done = true; holding = false; R.award('frequency'); }
      }
      function loop(t) { draw(t); frame = requestAnimationFrame(loop); }
      function resize() {
        const rect = band.getBoundingClientRect();
        w = rect.width; h = rect.height;
        const dpr = Math.min(devicePixelRatio || 1, 2);
        canvas.width = Math.round(w * dpr); canvas.height = Math.round(h * dpr);
        ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
      }
      // it trembles when anything moves
      addEventListener('scroll', () => { energy = Math.min(3, energy + Math.abs(scrollY - lastY) * .04); lastY = scrollY; }, { passive: true });
      addEventListener('pointermove', e => { if (!holding) energy = Math.min(3, energy + (Math.abs(e.movementX) + Math.abs(e.movementY)) * .015); });
      const start = () => { if (done) return; holding = true; holdStart = performance.now(); };
      const stop = () => { holding = false; };
      band.addEventListener('pointerdown', e => { band.setPointerCapture(e.pointerId); start(); });
      band.addEventListener('pointerup', stop);
      band.addEventListener('pointercancel', stop);
      band.addEventListener('keydown', e => { if ((e.key === ' ' || e.key === 'Enter') && !e.repeat) { e.preventDefault(); start(); } });
      band.addEventListener('keyup', e => { if (e.key === ' ' || e.key === 'Enter') stop(); });
      new ResizeObserver(resize).observe(band);
      document.addEventListener('visibilitychange', () => { cancelAnimationFrame(frame); if (!document.hidden) frame = requestAnimationFrame(loop); });
      resize();
      frame = requestAnimationFrame(loop);
      document.querySelectorAll('[data-leave]').forEach(a => a.addEventListener('click', e => { e.preventDefault(); R.go(a.getAttribute('href')); }));
    })();
  </script>
</body>
</html>
